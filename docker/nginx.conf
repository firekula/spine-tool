# Static server for the Spine preview / Atlas export tool.
#
# The app is a client-side SPA. Every bundle, worker and license file is served
# from this container; nothing is fetched from the network at runtime, so the
# only routing rule required is the SPA fallback for deep links and refreshes.
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # Liveness endpoint for the image HEALTHCHECK and for orchestrators.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/javascript
                    application/javascript application/json
                    application/wasm image/svg+xml;

    # The app needs neither SharedArrayBuffer nor cross-origin isolation, so
    # COOP/COEP are deliberately absent. `always` also covers error responses.
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header X-Frame-Options        "SAMEORIGIN"  always;

    # Mirrors the CSP the offline build ships as a <meta> tag. The bundle uses
    # no inline scripts/styles and no eval, so 'self' is sufficient; `connect-src
    # 'none'` is correct because the tool never talks to the network.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; form-action 'none'; base-uri 'none'" always;

    # Vite emits content-hashed filenames here, so they can be cached forever.
    # `expires` is used instead of add_header so the headers above stay inherited.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /licenses/ {
        expires 30d;
        try_files $uri =404;
    }

    # SPA entry point. `expires -1` sends Cache-Control: no-cache, so clients
    # always revalidate the HTML shell that references the hashed bundles.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
